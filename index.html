<!doctype html>
<html lang="es">
  <head>

    <!-- ===== TAILWIND (Play CDN) ===== -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      .collapse:not(.show) {

      .navbar-collapse.collapsing {

      }
      @media (min-width: 992px) {
        .navbar-expand-lg .navbar-collapse {
          display: flex !important;
        }
      }

      /* Texto claro sobre fondos oscuros (contraste AA) */
      body { color: #e2e8f0; }
      h1, h2, h3, .navbar-brand { color: #f8fafc; }
      .hero-lead { color: #cbd5e1 !important; }

<!-- ===================== NAVBAR ===================== -->
